<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" font-family="Arial, Helvetica, sans-serif">
  <style>
    .title{font:700 20px sans-serif; fill:#0f172a}
    .sub{font:12px sans-serif; fill:#475569}
    .label{font:13px sans-serif; fill:#334155}
    .val{font:12px sans-serif; fill:#0f172a}
    .axis{stroke:#94a3b8; stroke-width:1}
    .grid{stroke:#e2e8f0; stroke-width:1}
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="34" class="title">Open-Source Engineering Simulation Portfolio — Domain Coverage</text>
  <text x="30" y="54" class="sub">18 project modules organized by engineering/scientific domain (source/configuration artifacts included; tool-generated outputs produced on execution)</text>
  <g transform="translate(260,80)">
    <!-- grid/axis -->
    <line x1="0" y1="220" x2="660" y2="220" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="220" class="axis"/>
    <g class="sub">
      <line x1="165" y1="0" x2="165" y2="220" class="grid"/><text x="165" y="238" text-anchor="middle">1</text>
      <line x1="330" y1="0" x2="330" y2="220" class="grid"/><text x="330" y="238" text-anchor="middle">2</text>
      <line x1="495" y1="0" x2="495" y2="220" class="grid"/><text x="495" y="238" text-anchor="middle">3</text>
      <line x1="660" y1="0" x2="660" y2="220" class="grid"/><text x="660" y="238" text-anchor="middle">4</text>
      <text x="330" y="258" text-anchor="middle">Number of projects</text>
    </g>
    <!-- bars (scaled 165px per project) -->
    <!-- CFD / Aerodynamics: 2 -->
    <text x="-12" y="23" text-anchor="end" class="label">CFD / Aerodynamics</text>
    <rect x="0" y="8" width="330" height="22" rx="4" fill="#2563eb"/><text x="338" y="24" class="val">2</text>
    <!-- FEA / Heat / Structural / Solid: 4 -->
    <text x="-12" y="53" text-anchor="end" class="label">FEA (Thermal/Structural/Solid)</text>
    <rect x="0" y="38" width="660" height="22" rx="4" fill="#0ea5e9"/><text x="668" y="54" class="val">4</text>
    <!-- Materials / Atomistics / DFT / MD: 4 -->
    <text x="-12" y="83" text-anchor="end" class="label">Materials / DFT / Atomistics / MD</text>
    <rect x="0" y="68" width="660" height="22" rx="4" fill="#10b981"/><text x="668" y="84" class="val">4</text>
    <!-- Electrochemistry: 1 -->
    <text x="-12" y="113" text-anchor="end" class="label">Electrochemical Modeling</text>
    <rect x="0" y="98" width="165" height="22" rx="4" fill="#14b8a6"/><text x="173" y="114" class="val">1</text>
    <!-- Circuits / Power / Analog: 2 -->
    <text x="-12" y="143" text-anchor="end" class="label">Circuit Simulation (Analog/Power)</text>
    <rect x="0" y="128" width="330" height="22" rx="4" fill="#f59e0b"/><text x="338" y="144" class="val">2</text>
    <!-- HDL / Verification / Synthesis: 2 -->
    <text x="-12" y="173" text-anchor="end" class="label">HDL Design / Verification / Synthesis</text>
    <rect x="0" y="158" width="330" height="22" rx="4" fill="#8b5cf6"/><text x="338" y="174" class="val">2</text>
    <!-- CAD / Meshing / PCB: 3 -->
    <text x="-12" y="203" text-anchor="end" class="label">CAD / Meshing / PCB</text>
    <rect x="0" y="188" width="495" height="22" rx="4" fill="#ef4444"/><text x="503" y="204" class="val">3</text>
  </g>
</svg>
